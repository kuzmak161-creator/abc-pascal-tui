<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
    
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d200d"/>
      <stop offset="70%" stop-color="#050a05"/>
      <stop offset="100%" stop-color="#020402"/>
    </radialGradient>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bg-grad)"/>

  <!-- Background code -->
  <g clip-path="url(#circle-clip)" opacity="0.12" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00ff00">
    <text x="15" y="35">Program anal;</text>
    <text x="15" y="55">Begin</text>
    <text x="15" y="75">  Write('hello world');</text>
    <text x="15" y="95">End.</text>
    <text x="15" y="125">Program anal;</text>
    <text x="15" y="145">Begin</text>
    <text x="15" y="165">  Write('hello world');</text>
    <text x="15" y="185">End.</text>
    <text x="15" y="215">Program anal;</text>
    <text x="15" y="235">Begin</text>
    <text x="15" y="255">  Write('hello world');</text>
    <text x="15" y="275">End.</text>
    <text x="15" y="305">Program anal;</text>
    <text x="15" y="325">Begin</text>
    <text x="15" y="355">  Write('hello world');</text>
    <text x="15" y="375">End.</text>
    <text x="210" y="55">Program anal;</text>
    <text x="210" y="75">Begin</text>
    <text x="210" y="95">  Write('hello world');</text>
    <text x="210" y="115">End.</text>
    <text x="210" y="145">Program anal;</text>
    <text x="210" y="165">Begin</text>
    <text x="210" y="185">  Write('hello world');</text>
    <text x="210" y="205">End.</text>
    <text x="210" y="235">Program anal;</text>
    <text x="210" y="255">Begin</text>
    <text x="210" y="275">  Write('hello world');</text>
    <text x="210" y="295">End.</text>
    <text x="210" y="325">Program anal;</text>
    <text x="210" y="345">Begin</text>
    <text x="210" y="365">  Write('hello world');</text>
    <text x="210" y="385">End.</text>
  </g>

  <!-- Outer rings -->
  <circle cx="200" cy="200" r="183" fill="none" stroke="#00ff00" stroke-width="3" filter="url(#neon-glow)" opacity="0.4"/>
  <circle cx="200" cy="200" r="183" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>


  <!-- ABC pascal - Comic Sans, white glow -->
  <text
    x="200" y="185"
    font-family="'Comic Sans MS', 'Comic Sans', cursive"
    font-size="52"
    font-weight="bold"
    text-anchor="middle"
    fill="#00ff00"
    filter="url(#neon-glow)"
  >ABC pascal</text>
  <text
    x="200" y="185"
    font-family="'Comic Sans MS', 'Comic Sans', cursive"
    font-size="52"
    font-weight="bold"
    text-anchor="middle"
    fill="#ffffff"
  >ABC pascal</text>

  <!-- TUI box -->
  <g filter="url(#neon-glow)">
    <rect x="130" y="210" width="140" height="46" rx="6" fill="#002200" stroke="#00ff00" stroke-width="2"/>
  </g>
  <text
    x="200" y="244"
    font-family="'Comic Sans MS', 'Comic Sans', cursive"
    font-size="32"
    font-weight="bold"
    text-anchor="middle"
    fill="#ffffff"
  >TUI</text>


</svg>
